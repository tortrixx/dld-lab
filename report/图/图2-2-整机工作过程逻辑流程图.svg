<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2179" viewBox="0 0 1860 2179"><rect width="1860" height="2179" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#000000"/></marker></defs><rect x="1130.5" y="642.7" width="623.4" height="277.8" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="12,8"/>
<text x="1156.5" y="686.1" font-family="SimHei, 黑体, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="start">全局规则</text>
<text x="1156.5" y="728.1" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="start">㈠ SW7 拨至「0」：所有显示器件即时熄灭、</text>
<text x="1156.5" y="770.1" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="start">蜂鸣器静音，同时产生复位，系统回到上电</text>
<text x="1156.5" y="812.1" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="start">复位之后的状态。</text>
<text x="1156.5" y="854.1" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="start">㈡ 任意状态按「开始」键：立即从第一关的</text>
<text x="1156.5" y="896.1" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="start">图案预览重新开始，不必先回到待机状态。</text>
<rect x="461.0" y="40.0" width="238.0" height="94.2" rx="47.1" ry="47.1" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
<text x="580.0" y="98.0" font-family="SimHei, 黑体, sans-serif" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle">上电启动</text>
<rect x="236.1" y="170.2" width="687.8" height="76.2" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="219.2" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">上电复位：全部寄存器清零，保持约 10 ms</text>
<rect x="235.4" y="282.5" width="689.1" height="160.7" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="331.5" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">开机自检：点阵全部显示黄色、</text>
<text x="580.0" y="373.7" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">8 位数码管全部显示「8」，两者均以 2 Hz</text>
<text x="580.0" y="416.0" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">闪烁，持续 2 秒</text>
<polygon points="129.8,479.2 1064.2,479.2 1030.2,579.2 95.8,579.2" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="540.1" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">待机显示：点阵熄灭，DISP7 显示「5」，DISP0 显示关卡号</text>
<polygon points="580.0,615.2 786.7,697.9 580.0,780.5 373.3,697.9" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="708.7" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">按「开始」键？</text>
<rect x="286.0" y="816.5" width="588.0" height="160.7" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="865.5" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">本局初始化：关卡置为第 1 关，</text>
<text x="580.0" y="907.8" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">重新采样随机种子、清除锁定标志；</text>
<text x="580.0" y="950.0" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">零片随机散落且互不重叠</text>
<polygon points="195.1,1013.3 998.9,1013.3 964.9,1113.3 161.1,1113.3" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="1074.1" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">图案预览：点阵显示完整图案，DISP7 倒计时 5→1</text>
<rect x="89.5" y="1149.3" width="981.0" height="76.2" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="1198.3" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">进入拼图：限时倒计时开始（第 1 关 30 秒／第 2 关 40 秒）</text>
<polygon points="580.0,1261.5 813.3,1354.8 580.0,1448.2 346.7,1354.8" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
