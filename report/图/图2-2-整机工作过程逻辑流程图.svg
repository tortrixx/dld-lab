<polygon points="580.0,1484.2 760.0,1572.4 580.0,1660.6 400.0,1572.4" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="1562.2" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">零片掩码并集</text>
<text x="580.0" y="1604.4" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">＝目标图案？</text>
<polygon points="580.0,1696.6 721.6,1784.9 580.0,1873.1 438.4,1784.9" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="1774.6" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">当前是</text>
<text x="580.0" y="1816.9" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">第 1 关？</text>
<polygon points="382.0,1909.1 812.0,1909.1 778.0,2009.1 348.0,2009.1" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="580.0" y="1970.0" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">显示胜利图案，本局结束</text>
