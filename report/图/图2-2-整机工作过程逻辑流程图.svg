<rect x="1101.8" y="1542.4" width="556.5" height="144.9" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="1380.0" y="1587.4" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="middle">按键操作循环：选择键切换零片；</text>
<text x="1380.0" y="1624.3" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="middle">方向键移动零片（长按 500 ms 后</text>
<text x="1380.0" y="1661.3" font-family="SimSun, 宋体, serif" font-size="28" font-weight="normal" fill="#000000" text-anchor="middle">每 100 ms 连发）；确认键锁定零片。</text>
<polygon points="1182.0,1804.8 1612.0,1804.8 1578.0,1904.8 1148.0,1904.8" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>
<text x="1380.0" y="1865.7" font-family="SimSun, 宋体, serif" font-size="32" font-weight="normal" fill="#000000" text-anchor="middle">显示失败图案，本局结束</text>
