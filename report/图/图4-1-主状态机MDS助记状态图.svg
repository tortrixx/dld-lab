<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1206" viewBox="0 0 1720 1206"><rect width="1720" height="1206" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#000000"/></marker></defs><rect x="55.0" y="44.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="290.0" y="116.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">开机自检</text>
<text x="290.0" y="153.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"000"</text>
<text x="290.0" y="191.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵全黄闪烁，</text>
<text x="290.0" y="225.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">数码管全显「8」</text>
<rect x="625.0" y="44.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="860.0" y="116.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">待机</text>
<text x="860.0" y="153.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"001"</text>
<text x="860.0" y="191.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵熄灭；</text>
<text x="860.0" y="225.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">DISP7=5，DISP0=关卡号</text>
<rect x="1195.0" y="44.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="1430.0" y="116.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">图案预览</text>
<text x="1430.0" y="153.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"010"</text>
<text x="1430.0" y="191.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵示目标图案；</text>
<text x="1430.0" y="225.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">DISP7=预览倒计时</text>
<rect x="1195.0" y="514.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="1430.0" y="586.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">拼图中</text>
<text x="1430.0" y="623.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"011"</text>
<text x="1430.0" y="661.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵示零片；</text>
<text x="1430.0" y="695.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">DISP4、3=拼图倒计时</text>
<rect x="625.0" y="954.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="860.0" y="1026.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">胜利</text>
<text x="860.0" y="1063.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"100"</text>
<text x="860.0" y="1101.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵示胜利图案</text>
<text x="860.0" y="1135.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">（对勾）</text>
<rect x="1195.0" y="954.0" width="470.0" height="212.0" fill="#ffffff" stroke="#000000" stroke-width="2.0"/>

<text x="1430.0" y="1026.2" font-family="SimHei, 黑体, sans-serif" font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">失败</text>
<text x="1430.0" y="1063.9" font-family="SimSun, 宋体, serif" font-size="30" font-weight="normal" fill="#000000" text-anchor="middle">"101"</text>
<text x="1430.0" y="1101.7" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">出：点阵示失败图案</text>
<text x="1430.0" y="1135.2" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="middle">（叉）</text>
<path d="M525.0,150.0 L623.0,150.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="575.0" y="142.2" font-family="SimSun, 宋体, serif" font-size="24" font-weight="normal" fill="#000000" text-anchor="middle">自检结束</text>
<path d="M1095.0,150.0 L1193.0,150.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="1145.0" y="141.5" font-family="SimSun, 宋体, serif" font-size="22" font-weight="normal" fill="#000000" text-anchor="middle">按开始键</text>
<path d="M1474.0,256.0 L1474.0,512.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="1492.0" y="393.2" font-family="SimSun, 宋体, serif" font-size="24" font-weight="normal" fill="#000000" text-anchor="start">预览 5 秒结束</text>
<path d="M1386.0,514.0 L1386.0,254.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="1368.0" y="393.2" font-family="SimSun, 宋体, serif" font-size="24" font-weight="normal" fill="#000000" text-anchor="end">第一关过关：关卡←2，重开一局</text>
<path d="M1195.0,620.0 L860.0,620.0 L860.0,952.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="878.0" y="795.2" font-family="SimSun, 宋体, serif" font-size="24" font-weight="normal" fill="#000000" text-anchor="start">第二关过关</text>
<path d="M1430.0,726.0 L1430.0,952.0" fill="none" stroke="#000000" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="1448.0" y="848.2" font-family="SimSun, 宋体, serif" font-size="24" font-weight="normal" fill="#000000" text-anchor="start">超时，或全锁未拼对</text>
<rect x="80.0" y="630.0" width="660.0" height="300.0" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="12,8"/>
<text x="106.0" y="676.0" font-family="SimHei, 黑体, sans-serif" font-size="25" font-weight="bold" fill="#000000" text-anchor="start">全局迁移规则</text>
<text x="106.0" y="713.5" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">㈠ 复位：rst 有效（BTN0 按键复位／上电复</text>
<text x="106.0" y="751.0" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">位／SW7 拨至「0」）→ 任意状态回到</text>
<text x="106.0" y="788.5" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">S_SELF_TEST，全部寄存器清零。</text>
<text x="106.0" y="826.0" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">㈡ 重开：任意状态按「开始」键 → 直接进入</text>
<text x="106.0" y="863.5" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">S_PREVIEW（不经 S_IDLE）；S_WIN、S_FAIL</text>
<text x="106.0" y="901.0" font-family="SimSun, 宋体, serif" font-size="25" font-weight="normal" fill="#000000" text-anchor="start">显示期间同样适用。</text></svg>